            border: 2px dashed #ffffff;
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .btn-telegram:hover {

            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.7), 0 0 15px #ffffff;
        }

        .btn-telegram svg {
            width: 24px;
            height: 24px;

        }

        .timer-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 10px;
        }

        .timer-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .time-segment {

            flex-direction: column;
            align-items: center;
            min-width: 55px;
        }

        .time-number {
            font-size: 24px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);

        .time-label {

            color: #a0a0a0;

        .separator {

            color: #6f42c1;

        @keyframes blink {

        }

        .footer-text {

    <script>
        let totalSeconds = 120; 
        function updateTimer() {
            if (totalSeconds <= 0) { totalSeconds = 120; }
            let displayMins = Math.floor(totalSeconds / 60);
            let displaySecs = totalSeconds % 60;
            
            if (displayMins === 2) {
                document.getElementById('minutes').innerText = "02";
                document.getElementById('seconds').innerText = "00";
            } else {
                document.getElementById('minutes').innerText = String(displayMins).padStart(2, '0');
                document.getElementById('seconds').innerText = String(displaySecs).padStart(2, '0');
            }
            totalSeconds--;
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
